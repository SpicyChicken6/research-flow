    inputs: [data/processed/cpm.tsv]
    outputs: [data/processed/log-cpm-v2.tsv]
    method: Apply log2(CPM + 1) independently to each matrix value, keeping feature and sample identifiers unchanged.
    parameters: |
      logarithm_base: 2
      pseudocount: 1
      input_scale: counts per million
      missing_value_policy: error
      negative_value_policy: error
    rationale: Keep the pseudocount choice visible as a separate transformation that can be reviewed or changed.
