    parameters: |
      min_count: 10
      min_samples: 3
      comparison: count >= min_count
      missing_value_policy: error
      negative_count_policy: error
      preserve_feature_order: true
    rationale: Make the illustrative filtering rule and excluded feature list individually inspectable.
