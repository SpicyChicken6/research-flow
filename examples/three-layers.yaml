    depends_on: []
    inputs: [data/processed/filtered-counts.tsv]
    outputs: [data/processed/cpm.tsv, data/processed/retained-library-totals.tsv]
    method: For each sample, divide each retained feature count by that sample's sum of retained feature counts, then multiply by 1000000.
    parameters: |
      scale: 1000000
      library_total: sum of retained feature counts per sample
      zero_library_policy: error
      missing_value_policy: error
      negative_count_policy: error
    rationale: Expose the chosen library-size denominator before the subsequent log transformation.
    notes: Fictional planned processing node. Inputs and outputs are illustrative paths; no values were transformed and no files were created.
