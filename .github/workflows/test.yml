name: Test Research Flow
on: [push, pull_request]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    env:
      PIPX_HOME: /tmp/research-flow-pipx
      PIPX_BIN_DIR: /tmp/research-flow-bin
      PIPX_MAN_DIR: /tmp/research-flow-man
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build twine pipx
      - run: python -m build
      - run: python -m twine check dist/*.whl dist/*.tar.gz
      - run: python -m pipx install dist/*.whl
      - run: python tests/installed_checks.py "$PIPX_BIN_DIR/research-flow"
      - name: Verify offline self-updates in disposable pip and pipx environments
        run: |
          mkdir -p /tmp/research-flow-update-wheels
          cp dist/research_flow-*.whl /tmp/research-flow-update-wheels/
          python -m pip download --only-binary=:all: --dest /tmp/research-flow-update-wheels 'PyYAML>=6.0.2,<7' pip
          python tests/update_install_checks.py /tmp/research-flow-update-wheels/research_flow-*.whl "$(command -v pipx)"
      - run: |
          python -m venv /tmp/research-flow-sdist
          /tmp/research-flow-sdist/bin/python -m pip install dist/*.tar.gz
          python tests/installed_checks.py /tmp/research-flow-sdist/bin/research-flow
          cd /tmp
          /tmp/research-flow-sdist/bin/python -m research_flow --version
  units:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: node --test tests/test_*.mjs
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[test]"
      - run: python scripts/build_preview.py
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser/essential_checks.py
      - run: python tests/browser/logo_motion_checks.py
      - run: python tests/browser/children_checks.py
      - run: python tests/browser/branch_update_checks.py
      - run: python tests/browser/linux_browser_checks.py
