name: Test Research Flow
on: [push, pull_request]
permissions:
  contents: read
jobs:
  units:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: node --test tests/test_*.mjs
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/build_preview.py
      - run: python -m playwright install --with-deps chromium
      - run: python tests/essential_checks.py
      - run: python tests/logo_motion_checks.py
      - run: python tests/children_checks.py
      - run: python tests/branch_update_checks.py
      - run: python tests/linux_browser_checks.py
